name: Build macOS offline installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install . pyinstaller==6.17.0
          brew list --versions upx || brew install upx
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Build installer
        run: |
          python installer/macos/build.py \
            --upx "$(brew --prefix upx)/bin/upx" \
            --upx-license-dir "$(brew --prefix upx)"
      - name: Install and test package
        run: |
          sudo installer -pkg "dist/macos/AISA-Setup-macOS-${{ matrix.architecture }}.pkg" -target /
          /usr/local/bin/aisa --version
          python installer/smoke_test.py /usr/local/bin/aisa
      - uses: actions/upload-artifact@v4
        with:
          name: AISA-macOS-${{ matrix.architecture }}-installer
          path: dist/macos/AISA-Setup-macOS-${{ matrix.architecture }}.pkg
          if-no-files-found: error
