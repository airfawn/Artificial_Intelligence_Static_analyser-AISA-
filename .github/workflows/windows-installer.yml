name: Build Windows offline installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install . pyinstaller==6.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test model and analysis code
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_installer_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_behavior_analysis.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify official UPX
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "upx.zip"
          Invoke-WebRequest "https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip" -OutFile $archive
          $expected = "1cff6d6ee01c404d4a1ae56003056bd4cfa28d0a5cea1d0950daaf872a4facc9"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "UPX archive SHA-256 does not match the official release."
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
      - name: Download and verify Ollama runtime and model
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ollama-windows-amd64.zip"
          Invoke-WebRequest "https://github.com/ollama/ollama/releases/download/v0.32.5/ollama-windows-amd64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "7c941ae084569d298062d29f8139163a3187c76dbca0479c70d085e78fd8c7bb") {
            throw "Ollama archive SHA-256 mismatch."
          }
          $runtime = Join-Path $env:RUNNER_TEMP "aisa-ollama"
          Expand-Archive $archive -DestinationPath $runtime
          $license = Join-Path $runtime "LICENSE"
          Invoke-WebRequest "https://raw.githubusercontent.com/ollama/ollama/v0.32.5/LICENSE" -OutFile $license
          if ((Get-FileHash $license -Algorithm SHA256).Hash -ne "5934ed2ce0d15154bcdb9c85203210abac0da4314af34081e36df4599f90b226") {
            throw "Ollama license SHA-256 mismatch."
          }
          $env:OLLAMA_HOST = "127.0.0.1:11535"
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "aisa-models"
          $env:OLLAMA_NO_CLOUD = "1"
          $exe = Join-Path $runtime "ollama.exe"
          $server = Start-Process -FilePath $exe -ArgumentList "serve" -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if ($server.HasExited) { throw "Ollama server exited during startup." }
              try {
                Invoke-RestMethod "http://127.0.0.1:11535/api/tags" -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Ollama server did not start." }
            & $exe pull qwen3:1.7b
            if ($LASTEXITCODE -ne 0) { throw "Model download failed." }
            python installer/windows/verify_model.py $env:OLLAMA_MODELS
            if ($LASTEXITCODE -ne 0) { throw "Model verification failed." }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Build installer
        shell: pwsh
        run: |
          ./installer/windows/build.ps1 `
            -UpxDirectory "$env:RUNNER_TEMP\upx-5.0.2-win64" `
            -OllamaDirectory "$env:RUNNER_TEMP\aisa-ollama" `
            -ModelDirectory "$env:RUNNER_TEMP\aisa-models" `
            -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Test installed executable
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "dist\windows\AISA-Setup-x64.exe"
          $destination = Join-Path $env:RUNNER_TEMP "AISA test install"
          $originalPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $process = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=addtopath', "/DIR=`"$destination`"")
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          try {
            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if ($destination -notin ($userPath -split ';')) { throw "Installer did not add AISA to PATH." }
            python installer/windows/smoke_test.py "$destination\aisa.exe"
            if ($LASTEXITCODE -ne 0) { throw "Installed executable failed its smoke test." }
            $runtimePath = Join-Path $destination "ollama\"
            $remaining = Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($runtimePath, [System.StringComparison]::OrdinalIgnoreCase)
            }
            if ($remaining) { throw "Bundled Ollama processes remained after analysis." }
            & "$destination\upx\upx.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "Installed UPX failed its version check." }
          } finally {
            $uninstall = Start-Process -FilePath "$destination\unins000.exe" -Wait -PassThru `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if ($destination -in ($userPath -split ';')) { throw "Uninstall did not remove the AISA PATH entry." }
            if (($originalPath -replace ';+$', '') -ne ($userPath -replace ';+$', '')) {
              throw "Uninstall changed existing user PATH entries."
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AISA-Windows-x64-installer
          path: |
            dist/windows/AISA-Setup-x64.exe
            dist/windows/AISA-Setup-x64-*.bin
          if-no-files-found: error
